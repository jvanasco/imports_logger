[metadata]
name = imports_logger
version = attr: imports_logger.__VERSION__
url = https://github.com/jvanasco/imports_logger
author = Jonathan Vanasco
author_email = jvanasco@2xlp.com
description = Quick tool to log import statements
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE.txt
keywords = import, logging, memory
classifiers =
    Intended Audience :: Developers
    Programming Language :: Python :: 2.7
    Programming Language :: Python :: 3.5
    Programming Language :: Python :: 3.6
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3.15

[options]
package_dir =
    = src
packages = find:
python_requires = >=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, !=3.4.*
include_package_data = True
zip_safe = False
install_requires =
    psutil
    six

[options.packages.find]
where = src

[options.extras_require]
testing =
    pytest
    coverage

[tox:tox]
envlist = py27, py35, py36, py37, py38, py39, py310, py311, py312, py313, py314, py315
isolated_build = true

[testenv]
package = wheel
extras = testing
changedir = {envtmpdir}
setenv =
    COVERAGE_FILE = {envtmpdir}/.coverage
commands =
    python -m coverage run --source=imports_logger -m pytest {toxinidir}/tests {posargs}
    python -m coverage html -d {toxinidir}/htmlcov/{envname}

[bdist_wheel]
universal = true
