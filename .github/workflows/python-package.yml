name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '2.7'
            tox: py27
            image: python:2.7.18-buster
          - python: '3.5'
            tox: py35
            image: python:3.5.10-buster
          - python: '3.6'
            tox: py36
            image: python:3.6.15-bullseye
          - python: '3.7'
            tox: py37
            image: python:3.7.17-bullseye
          - python: '3.8'
            tox: py38
            image: python:3.8.20-bookworm
          - python: '3.9'
            tox: py39
            image: python:3.9.25-bookworm
          - python: '3.10'
            tox: py310
          - python: '3.11'
            tox: py311
          - python: '3.12'
            tox: py312
          - python: '3.13'
            tox: py313
          - python: '3.14'
            tox: py314
          - python: '3.15'
            tox: py315
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: ${{ !matrix.image }}
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: ${{ matrix.python == '3.15' }}
      - name: Test with tox
        if: ${{ !matrix.image }}
        env:
          TOX_ENV: ${{ matrix.tox }}
        run: |
          python -m pip install 'tox>=4,<5'
          python -m tox -e "$TOX_ENV"
      - name: Test with tox in legacy Python container
        if: ${{ matrix.image }}
        env:
          PYTHON_IMAGE: ${{ matrix.image }}
          TOX_ENV: ${{ matrix.tox }}
        run: |
          docker pull "$PYTHON_IMAGE"
          docker run --rm --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            "$PYTHON_IMAGE" sh -ec '
              python -m pip install --upgrade pip
              python -m pip install "tox<4"
              python -m tox -e "$1"
            ' sh "$TOX_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.tox }}
          path: htmlcov/${{ matrix.tox }}
          if-no-files-found: error
